name: doc-guard validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-config:
    name: Validate .doc-guard.yaml schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-doc-guard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mcp-doc-guard

      - name: Build MCP server
        run: npm run build
        working-directory: mcp-doc-guard

      - name: Validate .doc-guard.yaml files
        # NOTE: 此步骤依赖 --validate-only 参数（Phase -1 交付后启用）
        # 在 index.ts 实现 runValidateOnly() 之前，此步骤仅做 dry-run
        run: |
          echo "Scanning for .doc-guard.yaml files..."
          yaml_count=$(find "$GITHUB_WORKSPACE" -name ".doc-guard.yaml" \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" | wc -l)
          echo "Found ${yaml_count} .doc-guard.yaml file(s)"
          
          # 当 --validate-only 实现后取消注释：
          # node doc-guard/mcp-doc-guard/dist/index.js --validate-only
        env:
          DOCGUARD_ROOT: ${{ github.workspace }}

  check-pending-on-main:
    name: Check no pending changelogs on main
    runs-on: ubuntu-latest
    # 仅在推送到 main/master 时运行（PR 允许有 pending）
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check for pending changelog files
        run: |
          PENDING=$(find . -path "*/changelogs/pending/*.md" \
            -not -path "*/node_modules/*" \
            -not -name "migration-baseline.md" \
            2>/dev/null || true)
          
          if [ -n "$PENDING" ]; then
            echo "::error::main 分支发现未处理的 pending changelog，请先运行 Agent2 审查流程归档后再合并。"
            echo ""
            echo "残留文件："
            echo "$PENDING"
            exit 1
          fi
          
          echo "No pending changelogs found on main branch."
